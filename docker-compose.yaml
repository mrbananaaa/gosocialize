services:
  postgres:
    image: postgres:17-alpine
    container_name: gosocialize-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: gosocialize
    build:
      context: .
      dockerfile: ./Dockerfile
      target: dev
    init: true
    volumes:
      - type: bind
        source: .
        target: /app
    depends_on:
      - postgres
    env_file:
      - .env
    ports:
      - 8080:8080
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  postgres_data:
